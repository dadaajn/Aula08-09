<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidades do Mundo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .cidade-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        .cidade-card:hover {
            transform: scale(1.03);
        }
        .cidade-card h2 {
            font-size: 1.2rem;
            color: #444;
            padding: 10px 0;
            margin: 0;
        }
        .cidade-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Cidades Turísticas</h1>
    
    <div class="galeria">
        <!-- Cidade 1: Paris -->
        <div class="cidade-card">
            <h2>Paris</h2>
            <a href="https://wikipedia.org" target="_blank">
                <img src="https://unsplash.com" alt="Torre Eiffel em Paris">
            </a>
        </div>

        <!-- Cidade 2: Nova Iorque -->
        <div class="cidade-card">
            <h2>Nova Iorque</h2>
            <a href="https://wikipedia.org" target="_blank">
                <img src="https://unsplash.com" alt="Estátua da Liberdade em Nova Iorque">
            </a>
        </div>

        <!-- Cidade 3: Tóquio -->
        <div class="cidade-card">
            <h2>Tóquio</h2>
            <a href="https://wikipedia.org" target="_blank">
                <img src="https://unsplash.com" alt="Ruas iluminadas de Tóquio">
            </a>
        </div>

        <!-- Cidade 4: Rio de Janeiro -->
        <div class="cidade-card">
            <h2>Rio de Janeiro</h2>
            <a href="https://wikipedia.org" target="_blank">
                <img src="https://unsplash.com" alt="Cristo Redentor no Rio de Janeiro">
            </a>
        </div>

        <!-- Cidade 5: Roma -->
        <div class="cidade-card">
            <h2>Roma</h2>
            <a href="https://wikipedia.org" target="_blank">
                <img src="https://unsplash.com" alt="Coliseu de Roma">
            </a>
        </div>
    </div>

</body>
</html>
